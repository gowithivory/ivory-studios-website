<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client Login | Ivory Studios</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/assets/img/favicon-96.png" sizes="96x96" type="image/png">
  <link rel="icon" href="/assets/img/favicon-144.png" sizes="144x144" type="image/png">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#080706">
  <link rel="preload" href="/assets/fonts/syne-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">

</head>
<body class="auth-body">

<header class="auth-header"><a href="/" class="auth-logo" aria-label="Ivory Studios home"><svg class="logo-mark" viewBox="26 26 64 68" aria-hidden="true" focusable="false"><rect x="30" y="30" width="42" height="8" rx="4" fill="currentColor"/><rect x="47" y="38" width="8" height="44" rx="2" fill="currentColor"/><rect x="30" y="82" width="42" height="8" rx="4" fill="currentColor"/><rect class="logo-caret" x="78" y="32" width="8" height="56" rx="4" fill="#C19A5B"/></svg><span>Ivory<span class="logo-gap"> </span><span>Studios</span></span></a></header>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-eyebrow">Client Portal</div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-lead">Log in to track your projects and requests.</p>

    <form id="login-form" novalidate>
      <label class="field">
        <span>Email</span>
        <input id="li-email" type="email" autocomplete="email" maxlength="200" spellcheck="false" placeholder="you@company.com" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="li-pass" type="password" autocomplete="current-password" placeholder="Your password" required>
      </label>
      <button type="submit" class="btn-primary full-w">Log in</button>
      <div id="auth-note" class="auth-note" style="display:none" role="status" aria-live="polite"></div>
      <p class="auth-resend" id="resend-wrap" hidden>Didn’t get it, or the link expired? <button type="button" class="auth-link-btn" id="resend-btn">Send a new confirmation email</button></p>
    </form>

    <p class="auth-switch">Forgot your password? <a href="/reset-password">Reset it →</a></p>
    <p class="auth-switch">New here? <a href="/signup">Create an account →</a></p>
  </div>
</main>

<script src="/assets/js/vendor/supabase.min.js" defer></script>
<script type="module" src="/assets/js/auth.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
