<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client Login | Ivory Studios</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/syne-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="auth-body">

<a href="/" class="auth-logo">IVORY<span>STUDIOS</span></a>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-eyebrow">Client Portal</div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-lead">Log in to track your projects and requests.</p>

    <form id="login-form" novalidate>
      <label class="field">
        <span>Email</span>
        <input id="li-email" type="email" autocomplete="email" placeholder="you@company.com" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <button type="submit" class="btn-primary full-w">Log In</button>
      <div id="auth-note" class="auth-note" style="display:none"></div>
    </form>

    <p class="auth-switch">Forgot your password? <a href="/reset-password">Reset it →</a></p>
    <p class="auth-switch">New here? <a href="/signup">Create an account →</a></p>
  </div>
</main>

<script src="/assets/js/vendor/supabase.min.js"></script>
<script type="module" src="/assets/js/auth.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
