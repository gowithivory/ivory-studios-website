<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0}iframe{border:0;display:block;width:1280px;height:760px}</style></head>
<body>
<iframe id="f" src="/"></iframe>
<script>
document.getElementById('f').onload = () => {
  const fr = document.getElementById('f');
  const w = fr.contentWindow, d = fr.contentDocument;
  setTimeout(() => {
    const s = d.createElement('style');
    s.textContent = 'html{scroll-behavior:auto !important} *,*::before,*::after{animation:none !important;transition:none !important} .reveal-up,.reveal-fade,.reveal-right,.ht-line{opacity:1 !important;transform:none !important} .loader{display:none !important}';
    d.head.appendChild(s);
    const el = d.querySelector('.cta-band');
    w.scrollTo({ top: el.getBoundingClientRect().top + w.scrollY - 10, behavior: 'instant' });
  }, 1500);
};
</script>
</body></html>
