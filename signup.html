<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Account | Ivory Studios</title>
  <meta name="robots" content="noindex">
  <link rel="preload" href="/assets/fonts/syne-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
</head>
<body class="auth-body">

<a href="/" class="auth-logo" aria-label="Ivory Studios home"><svg class="logo-mark" viewBox="26 26 64 68" aria-hidden="true" focusable="false"><rect x="30" y="30" width="42" height="8" rx="4" fill="currentColor"/><rect x="47" y="38" width="8" height="44" rx="2" fill="currentColor"/><rect x="30" y="82" width="42" height="8" rx="4" fill="currentColor"/><rect class="logo-caret" x="78" y="32" width="8" height="56" rx="4" fill="#C19A5B"/></svg><span>IVORY<span>STUDIOS</span></span></a>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-eyebrow">Client Portal</div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-lead">Start a project and follow it through every phase.</p>

    <form id="signup-form" novalidate>
      <label class="field">
        <span>Full name</span>
        <input id="su-name" type="text" autocomplete="name" placeholder="Jane Doe" required>
      </label>
      <label class="field">
        <span>Email</span>
        <input id="su-email" type="email" autocomplete="email" placeholder="you@company.com" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="su-pass" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
      </label>
      <button type="submit" class="btn-primary full-w">Create Account</button>
      <div id="auth-note" class="auth-note" style="display:none"></div>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login">Log in →</a></p>
  </div>
</main>

<script src="/assets/js/vendor/supabase.min.js"></script>
<script type="module" src="/assets/js/auth.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
