<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — Ivory Studios</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
</head>
<body class="auth-body">

<a href="/" class="auth-logo">IVORY<span>STUDIOS</span></a>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-eyebrow">Client Portal</div>

    <!-- Step 1: request a reset link -->
    <form id="request-form" novalidate>
      <h1 class="auth-title">Reset password</h1>
      <p class="auth-lead">Enter your email and we'll send you a secure link to set a new password.</p>
      <label class="field">
        <span>Email</span>
        <input id="rp-email" type="email" autocomplete="email" placeholder="you@company.com" required>
      </label>
      <button type="submit" class="btn-primary full-w">Send Reset Link</button>
    </form>

    <!-- Step 2: set a new password (shown when arriving from the email link) -->
    <form id="newpass-form" novalidate hidden>
      <h1 class="auth-title">Choose a new password</h1>
      <p class="auth-lead">Almost done — pick a strong password to finish.</p>
      <label class="field">
        <span>New password</span>
        <input id="rp-pass" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
      </label>
      <button type="submit" class="btn-primary full-w">Update Password</button>
    </form>

    <div id="auth-note" class="auth-note" style="display:none"></div>
    <p class="auth-switch"><a href="/login">← Back to login</a></p>
  </div>
</main>

<script src="/assets/js/vendor/supabase.min.js"></script>
<script type="module" src="/assets/js/auth.js"></script>
  <!-- Vercel Analytics + Speed Insights -->
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
